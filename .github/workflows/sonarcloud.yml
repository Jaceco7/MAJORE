
name: Analisis SonarQube MAJORE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: Analizar codigo MAJORE
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Jaceco7_MAJORE
            -Dsonar.organization=REEMPLAZAR_CLAVE_ORGANIZACION
            -Dsonar.sources=.
            -Dsonar.exclusions=dist/**,node_modules/**
